syntax = "proto3";

option java_package = "ca.usherbrooke.ift605.mesh.proto";
option java_outer_classname = "MeshProto";

// Service de calcul
service CalcService {
    rpc Compute(CalcRequest) returns (CalcResponse);
    rpc HealthCheck(HealthReq) returns (HealthResp);
}

message CalcRequest {
    double a = 1;
    double b = 2;
    string op = 3;
}

message CalcResponse {
    double result = 1;
    int64 latencyMs = 2;
}

// Service de stockage
service StorageService {
    rpc Store(StoreRequest) returns (StoreResponse);
    rpc Retrieve(RetrieveRequest) returns (RetrieveResponse);
    rpc HealthCheck(HealthReq) returns (HealthResp);
}

message StoreRequest {
    string key = 1;
    string value = 2;
}

message StoreResponse {
    bool stored = 1;
}

message RetrieveRequest {
    string key = 1;
}

message RetrieveResponse {
    bool found = 1;
    string value = 2;
}

// Service de notification
service NotifService {
    rpc Notify(NotifRequest) returns (NotifResponse);
    rpc HealthCheck(HealthReq) returns (HealthResp);
}

message NotifRequest {
    string event = 1;
    string payload = 2;
}

message NotifResponse {
    bool accepted = 1;
}

// Messages communs de surveillance
message HealthReq {
    string serviceName = 1;
}

message HealthResp {
    string status = 1;
    int64 uptimeMs = 2;
    double cpuLoad = 3;
}